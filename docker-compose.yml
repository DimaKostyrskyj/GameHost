services:
  postgres:
    image: postgres:16-alpine
    container_name: gamehost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamehost
      POSTGRES_USER: gamehost
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - gamehost_postgres:/var/lib/postgresql/data

volumes:
  gamehost_postgres:
